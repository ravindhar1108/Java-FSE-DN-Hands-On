<div>
  <p *ngIf="isLoading; else courseGrid">Loading courses...</p>
  
  <ng-template #courseGrid>
    <div *ngIf="courses.length > 0; else noCourses">
      <app-course-card *ngFor="let c of courses; trackBy: trackByCourseId" [course]="c" (enrollRequested)="onEnroll($event)"></app-course-card>
      <p *ngIf="selectedCourseId">Selected course ID: {{ selectedCourseId }}</p>
    </div>
  </ng-template>

  <ng-template #noCourses>
    <p>No courses available.</p>
  </ng-template>
</div>
